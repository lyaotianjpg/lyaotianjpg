<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Merchant Terminal</title>
    <!-- Tailwind CSS v3/v4 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Web App Manifest Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .page-container {
            animation: fadeIn 0.25s ease-out forwards;
            padding-block: 0.125rem;
        }

        .page-container .mb-6,
        .page-container .my-6 {
            margin-bottom: 1.25rem !important;
        }

        .page-container .mt-6 {
            margin-top: 1.25rem !important;
        }

        .page-container .py-6 {
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
        }

        .page-container .p-6 {
            padding: 1.25rem !important;
        }

        .page-container .gap-6,
        .page-container .gap-5 {
            gap: 1rem !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Scanning laser line effect */
        @keyframes scan-laser {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 100%; opacity: 0.8; }
            100% { top: 0%; opacity: 0.8; }
        }
        .laser-line {
            animation: scan-laser 2s linear infinite;
        }

        /* Safe Area and Notch Padding adjustments */
        #app-header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 14px) !important;
            padding-inline: 1rem !important;
            padding-bottom: 0.75rem !important;
        }
        #bottom-nav {
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px) !important;
            height: calc(env(safe-area-inset-bottom, 0px) + 64px) !important;
        }
        #app-container {
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px) !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start overflow-x-hidden selection:bg-indigo-950">

    <!-- Main Mobile POS Terminal Frame -->
    <main id="app-container" class="w-full max-w-md min-h-screen bg-slate-900 flex flex-col relative shadow-2xl border-x border-slate-800 pb-20">
        
        <!-- App Header (M-Header) -->
        <header id="app-header" class="sticky top-0 bg-slate-950/90 backdrop-blur-md z-40 border-b border-slate-800 px-5 py-4 flex items-center justify-end">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 text-[10px] font-bold font-mono">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                    <span>ONLINE</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Router View -->
        <div id="router-view" class="flex-1 w-full px-4 py-4 overflow-y-auto no-scrollbar">
            <!-- Dynamic pages inject here -->
        </div>

        <!-- POS Tab Bar -->
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-950 border-t border-slate-800 px-8 py-2.5 flex items-center justify-between z-40 shadow-[0_-4px_16px_rgba(0,0,0,0.2)]">
            <button onclick="navigate('/home')" class="nav-item flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition flex-1" data-route="/home">
                <i data-lucide="scan" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">扫码收款</span>
            </button>
            <button onclick="navigate('/history')" class="nav-item flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition flex-1" data-route="/history">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">今日流水</span>
            </button>
            <button onclick="navigate('/settings')" class="nav-item flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition flex-1" data-route="/settings">
                <i data-lucide="sliders" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">终端设置</span>
            </button>
        </nav>
    </main>

    <!-- SIDE PANEL FOR QUICK CLIENT QR GENERATION & SIMULATION -->
    <div id="sim-panel" class="fixed inset-y-0 right-0 w-80 bg-slate-900 text-white shadow-2xl border-l border-slate-800 p-5 flex flex-col gap-4 z-50 transform translate-x-full transition-transform duration-300 ease-out">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="smartphone" class="w-5 h-5 text-indigo-400"></i>
                <span class="font-bold text-sm tracking-tight font-display">快捷付款测试中心</span>
            </div>
            <button onclick="toggleSimPanel()" class="text-slate-400 hover:text-white transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <p class="text-xs text-slate-400 leading-relaxed">
            为了在开发调试阶段模拟消费者展码，您可以在下方快速挑选或生成一张“消费者付款码”载荷，点击即可将其直接“投射”到收银终端的扫码区域，完成逼真的近场交易模拟。
        </p>

        <!-- Mock Customer Tokens selector -->
        <div class="flex flex-col gap-3.5">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">选择预设付款码载荷</h4>
            
            <div class="flex flex-col gap-2">
                <!-- Preset 1: Standard JPYSC 5000 Limit -->
                <button onclick="injectSimulatedPayload('JPYSC', 5000)" class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-indigo-500 transition-all flex flex-col gap-1">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold text-slate-200">标准日元钱包 (JPYSC)</span>
                        <span class="px-1.5 py-0.5 bg-indigo-500/10 text-indigo-400 rounded text-[8px] font-mono font-bold border border-indigo-500/20">推荐测试</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span>单次限额: ¥5,000</span>
                        <span class="font-mono text-slate-500">CPMP://PAY/...</span>
                    </div>
                </button>

                <!-- Preset 2: Large JPYSC 20000 Limit -->
                <button onclick="injectSimulatedPayload('JPYSC', 20000)" class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-indigo-500 transition-all flex flex-col gap-1">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold text-slate-200">大额支付钱包 (JPYSC)</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span>单次限额: ¥20,000</span>
                        <span class="font-mono text-slate-500">CPMP://PAY/...</span>
                    </div>
                </button>

                <!-- Preset 3: USD Wallet (USDC) -->
                <button onclick="injectSimulatedPayload('USDC', 250)" class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-indigo-500 transition-all flex flex-col gap-1">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold text-slate-200">美元跨链钱包 (USDC)</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span>单次限额: $250</span>
                        <span class="font-mono text-slate-500">CPMP://PAY/...</span>
                    </div>
                </button>

                <!-- Preset 4: Expired or Invalid Session -->
                <button onclick="injectSimulatedPayload('JPYSC', 3000, true)" class="w-full text-left p-3 rounded-xl bg-slate-800/50 hover:bg-slate-700 border border-red-950 hover:border-red-500 transition-all flex flex-col gap-1">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold text-red-400">已过期/已使用的 Session</span>
                        <span class="px-1.5 py-0.5 bg-red-500/10 text-red-400 rounded text-[8px] font-mono font-bold">异常测试</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span>单次限额: ¥3,000 (已过期)</span>
                        <span class="font-mono text-slate-500">CPMP://PAY/...</span>
                    </div>
                </button>
            </div>
        </div>

        <div class="mt-auto border-t border-slate-800 pt-4 flex flex-col gap-2">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">协议广播监控</span>
            <div id="sim-event-log" class="bg-slate-950 rounded-xl p-3 border border-slate-800 h-28 font-mono text-[9px] text-slate-400 overflow-y-auto no-scrollbar">
                <div>[SYSTEM] POS 收银台已就绪.</div>
            </div>
        </div>
    </div>

    <!-- SCRIPT FOR EXPERT POS INTERACTION -->
    <script>
        // State variables
        const state = {
            merchantName: "NeoCore Tokyo General Store",
            merchantId: "mer_tok_8842",
            settlementToken: "JPYSC",
            settlementAddress: "0x8842c2999e52f190bc91a45b90f42b3117ab8c9b",
            signingKeyAddress: "0x9922a1b181e149ab012871fa1b1178c92a2a0bc3",
            scannedSession: null,
            history: [
                { id: 'pay_901', amount: 124.50, token: 'JPYSC', payer: '0x3f12...5e8a', timestamp: '2026-07-19 14:32:00', status: 'SUCCESS', hash: '0x8f7c...29b1' },
                { id: 'pay_902', amount: 15.00, token: 'USDC', payer: '0x71a2...bc88', timestamp: '2026-07-18 09:15:22', status: 'SUCCESS', hash: '0x321a...71fa' },
                { id: 'pay_903', amount: 3500.00, token: 'JPYSC', payer: '0x12bb...9bc3', timestamp: '2026-07-17 17:40:10', status: 'SUCCESS', hash: '0xef88...9bc3' }
            ],
            currentInputAmount: '0',
            recentScannedPayload: null
        };

        // Synthesize payment sound (Web Audio API)
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'success') {
                    // Two pleasant upward notes
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.05, ctx.currentTime + 0.15);
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'scan') {
                    // Soft high beep
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'error') {
                    // Buzz
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch(e) {}
        }

        // Event logs logger
        function logSimEvent(msg, type = 'default') {
            const logBox = document.getElementById('sim-event-log');
            if (!logBox) return;
            const time = new Date().toLocaleTimeString();
            let color = 'text-slate-400';
            if (type === 'success') color = 'text-green-400 font-bold';
            if (type === 'info') color = 'text-indigo-400';
            if (type === 'error') color = 'text-red-400 font-bold';
            
            logBox.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Floating menu toggle
        let isSimOpen = false;
        function toggleSimPanel() {
            const panel = document.getElementById('sim-panel');
            if (isSimOpen) {
                panel.classList.add('translate-x-full');
                isSimOpen = false;
            } else {
                panel.classList.remove('translate-x-full');
                isSimOpen = true;
                playSound('scan');
            }
        }

        // HTML5-like Router
        const routes = {
            '/': loadHome,
            '/home': loadHome,
            '/confirm': loadConfirmAmount,
            '/processing': loadProcessing,
            '/success': loadSuccess,
            '/error': loadError,
            '/history': loadHistory,
            '/settings': loadSettings
        };

        function navigate(path) {
            const url = new URL(window.location.href);
            url.searchParams.set('route', path);
            window.history.pushState({}, '', url.toString());
            renderRoute(path);
        }

        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const route = params.get('route') || '/';
            renderRoute(route);
        });

        function renderRoute(path) {
            const loadFunc = routes[path] || loadHome;
            loadFunc();
            
            // Highlight bottom nav items
            document.querySelectorAll('.nav-item').forEach(btn => {
                if (btn.getAttribute('data-route') === path) {
                    btn.classList.add('text-indigo-400');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-indigo-400');
                    btn.classList.add('text-slate-500');
                }
            });

            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // M-01 HOME: SCANNER WINDOW
        function loadHome() {
            const container = document.getElementById('router-view');
            state.currentInputAmount = '0';
            
            container.innerHTML = `
                <div class="page-container flex flex-col gap-4 py-1 text-center">
                    <div class="text-left">
                        <span class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest font-mono">NEOPOS 收银台</span>
                        <h2 class="text-xl font-bold font-display text-white">扫描消费者付款码</h2>
                        <p class="text-xs text-slate-400 mt-1">请将扫码头对准或将客户付款码贴近下方感应区：</p>
                    </div>

                    <!-- Interactive Camera simulation box -->
                    <div class="w-full relative aspect-square bg-slate-950 border border-slate-800 rounded-[32px] overflow-hidden flex flex-col items-center justify-center shadow-inner group">
                        
                        <!-- Scanning Reticle/Border styling -->
                        <div class="absolute inset-10 border-2 border-indigo-500/25 rounded-2xl flex items-center justify-center transition-all duration-300 group-hover:border-indigo-500/50">
                            <!-- Corners -->
                            <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-indigo-500 -mt-1 -ml-1 rounded-tl-md"></div>
                            <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-indigo-500 -mt-1 -mr-1 rounded-tr-md"></div>
                            <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-indigo-500 -mb-1 -ml-1 rounded-bl-md"></div>
                            <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-indigo-500 -mb-1 -mr-1 rounded-br-md"></div>
                        </div>

                        <!-- Red laser scanning animated line -->
                        <div class="laser-line absolute left-0 right-0 h-0.5 bg-red-500/80 shadow-[0_0_8px_rgba(239,68,68,0.8)] z-10"></div>

                        <div class="relative z-10 flex flex-col items-center gap-4 px-6 text-center">
                            <div class="w-16 h-16 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20 shadow-md">
                                <i data-lucide="scan-line" class="w-8 h-8 animate-pulse"></i>
                            </div>
                            <div>
                                <h3 class="text-xs font-bold text-slate-200">相机检测区域</h3>
                                <p class="text-[10px] text-slate-500 mt-1 leading-relaxed">正在等待 CPM 载荷数据...</p>
                            </div>
                        </div>

                        <!-- Manual payload entry fallback -->
                        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-full max-w-[260px] flex gap-1 px-4 z-20">
                            <input id="payload-manual-input" type="text" placeholder="手动输入 CPMP://PAY/..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-[10px] text-slate-300 focus:outline-none focus:border-indigo-500 font-mono">
                            <button onclick="handleManualPayloadSubmit()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-xl transition active:scale-95">
                                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Testing prompt to help developers -->
                    <div class="bg-indigo-950/40 border border-indigo-900/40 rounded-2xl p-3.5 flex items-center justify-between text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-indigo-900/50 text-indigo-400 flex items-center justify-center shrink-0">
                                <i data-lucide="help-circle" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-200 leading-tight">需要付款码进行测试？</h4>
                                <span class="text-[10px] text-slate-500 leading-normal">点击右上角的“测试中心”挑选或投射付款码。</span>
                            </div>
                        </div>
                        <button onclick="toggleSimPanel()" class="text-[10px] font-bold text-indigo-400 bg-indigo-900/35 border border-indigo-500/30 px-3 py-1.5 rounded-xl hover:bg-indigo-900/50 transition">
                            去选择
                        </button>
                    </div>
                </div>
            `;
        }

        // Injected payloads from Test Center side panel
        function injectSimulatedPayload(token, maxLimit, isExpired = false) {
            playSound('scan');
            const sid = 'sid_' + Math.floor(Math.random() * 10000000);
            const tokenAddress = 'stkn_' + Math.floor(Math.random() * 9000);
            
            // Build CPMP specification string
            const payload = `CPMP://PAY/1/${sid}/${tokenAddress}`;
            
            const expTime = isExpired ? Math.floor(Date.now() / 1000) - 60 : Math.floor(Date.now() / 1000) + 30;

            state.scannedSession = {
                id: sid,
                maxAmount: maxLimit,
                token: token,
                payer: '0x' + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join(''),
                validBefore: expTime,
                isExpired: isExpired,
                used: false
            };

            logSimEvent(`成功扫描付款码！载荷: ${payload}`, 'success');
            logSimEvent(`付款钱包: ${state.scannedSession.payer.slice(0, 10)}...${state.scannedSession.payer.slice(-8)}`, 'info');
            logSimEvent(`单次限额: ${token === 'JPYSC' ? '¥' : '$'}${maxLimit}`, 'info');

            // Slide out sidebar
            const panel = document.getElementById('sim-panel');
            panel.classList.add('translate-x-full');
            isSimOpen = false;

            // Go to amount confirmation page
            navigate('/confirm');
        }

        function handleManualPayloadSubmit() {
            const input = document.getElementById('payload-manual-input');
            if (!input || !input.value.trim()) return;

            const val = input.value.trim();
            if (val.startsWith('CPMP://PAY/')) {
                injectSimulatedPayload('JPYSC', 5000);
            } else {
                playSound('error');
                alert('无效的 CPMP 付款码协议格式。必须以 CPMP://PAY/ 开头');
            }
        }

        // M-02 AMOUNT INPUT CONFIRMATION PANEL
        let confirmInterval = null;
        function loadConfirmAmount() {
            if (!state.scannedSession) {
                navigate('/home');
                return;
            }

            const container = document.getElementById('router-view');
            if (confirmInterval) clearInterval(confirmInterval);

            container.innerHTML = `
                <div class="page-container flex flex-col justify-between min-h-[70vh] py-1">
                    <div>
                        <!-- Header with back button -->
                        <div class="flex items-center gap-2 mb-4">
                            <button onclick="navigate('/home')" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition">
                                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            </button>
                            <div>
                                <span class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest font-mono">交易确认 / TRANSACTION</span>
                                <h2 class="text-sm font-bold text-white">输入并扣减金额</h2>
                            </div>
                        </div>

                        <!-- Amount input board -->
                        <div class="bg-slate-950 border border-slate-800 rounded-3xl p-4.5 mb-3 text-center">
                            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest block mb-1">扣款金额</span>
                            <div class="text-4xl font-bold text-white font-display flex items-center justify-center gap-1">
                                <span class="text-slate-400 text-3xl font-normal">${state.scannedSession.token === 'JPYSC' ? '¥' : '$'}</span>
                                <span id="pos-amount-val">${parseFloat(state.currentInputAmount).toLocaleString()}</span>
                            </div>
                            <div class="mt-2 text-[10px] text-slate-400 font-mono flex items-center justify-center gap-1.5">
                                <span>结算币种: ${state.scannedSession.token}</span>
                                <span class="text-slate-600">|</span>
                                <span id="pos-max-amount-label">允许单次最高: ${state.scannedSession.token === 'JPYSC' ? '¥' : '$'}${state.scannedSession.maxAmount.toLocaleString()}</span>
                            </div>
                        </div>

                        <!-- Dynamic Alert Row -->
                        <div id="pos-limit-alert" class="hidden mb-4 p-3 rounded-2xl bg-red-950/40 border border-red-900/50 text-[10px] text-red-400 flex gap-2">
                            <i data-lucide="alert-octagon" class="w-4 h-4 shrink-0"></i>

        function appendPosNum(num) {
            let str = state.currentInputAmount;
            if (str === '0') {
                str = num.toString();
            } else {
                str += num.toString();
            }
            state.currentInputAmount = str;
            document.getElementById('pos-amount-val').innerText = parseFloat(str).toLocaleString();
            validatePosInput();
        }

        function clearPosAmount() {
            state.currentInputAmount = '0';
            document.getElementById('pos-amount-val').innerText = '0';
            validatePosInput();
        }

        function backspacePosAmount() {
            let str = state.currentInputAmount;
            if (str.length > 1) {
                str = str.slice(0, -1);
            } else {
                str = '0';
            }
            state.currentInputAmount = str;
            document.getElementById('pos-amount-val').innerText = parseFloat(str).toLocaleString();
            validatePosInput();
        }

        function setPosPreset(v) {
            let parsed = parseFloat(state.currentInputAmount) || 0;
            if (v === state.scannedSession.maxAmount) {
                parsed = v;
            } else {
                parsed += v;
            }
            state.currentInputAmount = parsed.toString();
            document.getElementById('pos-amount-val').innerText = parsed.toLocaleString();
            validatePosInput();
        }

        function validatePosInput() {
            const parsed = parseFloat(state.currentInputAmount) || 0;
            const limitAlert = document.getElementById('pos-limit-alert');
            const payBtn = document.getElementById('pos-pay-confirm-btn');
            const btnText = document.getElementById('pos-btn-text');

            if (parsed > state.scannedSession.maxAmount) {
                limitAlert.classList.remove('hidden');
                payBtn.disabled = true;
                btnText.innerText = "金额超限无法支付";
            } else if (parsed <= 0) {
                limitAlert.classList.add('hidden');
                payBtn.disabled = true;
                btnText.innerText = "请输入扣款金额";
            } else {
                limitAlert.classList.add('hidden');
                payBtn.disabled = false;
                btnText.innerText = `确认交易 ¥${parsed.toLocaleString()} ${state.scannedSession.token}`;
            }
        }

        function startPosCountdownTimer() {
            const label = document.getElementById('pos-time-left');
            if (!label) return;

            const update = () => {
                const now = Math.floor(Date.now() / 1000);
                const diff = state.scannedSession.validBefore - now;
                if (diff <= 0 || state.scannedSession.isExpired) {
                    clearInterval(confirmInterval);
                    label.innerText = "付款码已失效";
                    label.className = "font-bold text-red-500 font-mono animate-shake";
                    
                    // Direct to error page
                    setTimeout(() => {
                        triggerPOSError('SESSION_EXPIRED');
                    }, 1000);
                } else {
                    label.innerText = `${diff}秒`;
                    if (diff <= 10) {
                        label.className = "font-bold text-red-500 font-mono animate-pulse";
                    } else if (diff <= 20) {
                        label.className = "font-bold text-amber-500 font-mono";
                    } else {
                        label.className = "font-bold text-indigo-400 font-mono";
                    }
                }
            };

            update();
            confirmInterval = setInterval(update, 1000);
        }

        // Sim Session Updater Helper
        function updateSimPanelSession() {
            const sidLabel = document.getElementById('sim-session-id');
            const limitLabel = document.getElementById('sim-max-limit');
            const submitBtn = document.getElementById('sim-submit-btn');
            const amtInput = document.getElementById('sim-amount-input');
            const tokenBadge = document.getElementById('sim-token-badge');

            if (!sidLabel) return;

            if (state.scannedSession) {
                sidLabel.innerText = state.scannedSession.id;
                limitLabel.innerText = `上限: ${state.scannedSession.token === 'JPYSC' ? '¥' : '$'}${state.scannedSession.maxAmount.toLocaleString()}`;
                tokenBadge.innerText = state.scannedSession.token;
                submitBtn.removeAttribute('disabled');
                amtInput.value = state.scannedSession.maxAmount;
            } else {
                sidLabel.innerText = "请先扫描/挑选付款码载荷";
                limitLabel.innerText = "限额: --";
                submitBtn.setAttribute('disabled', 'true');
            }
        }

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            // Read direct query parameter
            const params = new URLSearchParams(window.location.search);
            const route = params.get('route') || '/';
            renderRoute(route);
        });
