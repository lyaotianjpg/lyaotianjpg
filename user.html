<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Consumer Wallet</title>
    <!-- Tailwind CSS v3/v4 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRious QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Web App Manifest Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Smooth slide-in/out transitions */
        .page-container {
            animation: fadeIn 0.25s ease-out forwards;
            padding-block: 0.125rem;
        }

        .page-container .mb-6,
        .page-container .my-6 {
            margin-bottom: 1.25rem !important;
        }

        .page-container .mt-6 {
            margin-top: 1.25rem !important;
        }

        .page-container .py-6 {
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
        }

        .page-container .p-6 {
            padding: 1.25rem !important;
        }

        .page-container .gap-6,
        .page-container .gap-5 {
            gap: 1rem !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Simulated shake animation for expiring QR */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out infinite;
        }

        /* Safe Area and Notch Padding adjustments */
        #app-header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 14px) !important;
            padding-inline: 1rem !important;
            padding-bottom: 0.75rem !important;
        }
        #bottom-nav {
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px) !important;
            height: calc(env(safe-area-inset-bottom, 0px) + 64px) !important;
        }
        #app-container {
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px) !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center justify-start overflow-x-hidden selection:bg-indigo-100">

    <!-- Main Mobile Frame Container -->
    <main id="app-container" class="w-full max-w-md min-h-screen bg-white flex flex-col relative shadow-xl shadow-slate-200/50 border-x border-slate-100 pb-20">
        
        <!-- App Header (C-Header) -->
        <header id="app-header" class="sticky top-0 bg-white/95 backdrop-blur-md z-40 border-b border-slate-100 px-5 py-4 flex items-center justify-end">
            <div class="flex items-center gap-3">
                <!-- Simulation Hub / Quick Control Trigger -->
                <button id="sim-trigger-btn" onclick="toggleSimPanel()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-indigo-50 hover:bg-indigo-100 border border-indigo-100 text-indigo-700 text-xs font-semibold transition active:scale-95">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-600"></span>
                    </span>
                    <!-- <span>商户模拟器</span> -->
                </button>
            </div>
        </header>

        <!-- Dynamic Content Router Area -->
        <div id="router-view" class="flex-1 w-full px-4 py-4 sm:px-5 overflow-y-auto no-scrollbar">
            <!-- Dynamic pages will inject here -->
        </div>

        <!-- Sticky Bottom Navigation (Hidden during onboarding) -->
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 px-8 py-2.5 flex items-center justify-between z-40 shadow-[0_-4px_16px_rgba(0,0,0,0.03)] hidden">
            <button onclick="navigate('/home')" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition flex-1" data-route="/home">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">钱包首页</span>
            </button>
            <button onclick="navigate('/history')" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition flex-1" data-route="/history">
                <i data-lucide="history" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">消费流水</span>
            </button>
            <button onclick="navigate('/settings')" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition flex-1" data-route="/settings">
                <i data-lucide="settings" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">安全设置</span>
            </button>
        </nav>
    </main>

    <!-- FLOATING SIMULATION PANEL -->
    <div id="sim-panel" class="fixed inset-y-0 right-0 w-80 bg-slate-900 text-white shadow-2xl border-l border-slate-800 p-6 flex flex-col gap-5 z-50 transform translate-x-full transition-transform duration-300 ease-out">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="terminal" class="w-5 h-5 text-indigo-400"></i>
                <span class="font-bold text-sm tracking-tight font-display">商户模拟器</span>
            </div>
            <button onclick="toggleSimPanel()" class="text-slate-400 hover:text-white transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <p class="text-xs text-slate-400 leading-relaxed">
            此模拟器代表商户端的 POS / 收银 App。当消费者展码时，在此输入消费金额，即可触发协议路由、链上签名结算并向消费者钱包回传通知。
        </p>

        <!-- Sim Input Form -->
        <div class="flex flex-col gap-4 bg-slate-800/60 p-4 rounded-2xl border border-slate-800">
            <div>
                <label class="block text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-1">活跃 Session ID</label>
                <div id="sim-session-id" class="text-xs font-mono text-slate-300 truncate bg-slate-950 px-3 py-2 rounded-lg border border-slate-800">
                    请先切换至“展示付款码”页面
                </div>
            </div>

            <div>
                <div class="flex justify-between text-[10px] mb-1">
                    <span class="font-bold text-slate-400 uppercase tracking-wider">商户扣款金额</span>
                    <span id="sim-max-limit" class="text-indigo-400 font-bold">限额: --</span>
                </div>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-bold text-slate-400 text-sm">¥</span>
                    <input type="number" id="sim-amount-input" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-8 pr-12 text-sm font-bold text-white focus:outline-none focus:border-indigo-500 transition">
                    <span id="sim-token-badge" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[10px] font-bold text-slate-400 uppercase tracking-wide">JPYSC</span>
                </div>
            </div>

            <button id="sim-submit-btn" onclick="executeSimulatedPayment()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-950/50 flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                <i data-lucide="scan-line" class="w-4 h-4"></i>
                <span>扫描付款码并结算</span>
            </button>
        </div>

        <!-- Live Event Stream Monitor -->
        <div class="flex-1 flex flex-col min-h-0">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-1">
                <i data-lucide="activity" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span>链上事件 / 结算日志</span>
            </h4>
            <div id="sim-event-log" class="flex-1 bg-slate-950 rounded-2xl border border-slate-800 p-3.5 font-mono text-[10px] text-slate-300 overflow-y-auto flex flex-col gap-2 no-scrollbar">
                <div class="text-slate-500">[SYSTEM] 协议调试网络已就绪。</div>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
        // State management
        const state = {
            isActivated: false,
            walletBalance: {
                JPYSC: 12480,
                USDC: 350
            },
            selectedToken: 'JPYSC',
            maxAmount: 5000,
            history: [
                { id: 'tx_1', amount: 124.50, token: 'JPYSC', merchant: 'Fresh Market', timestamp: '2026-07-19 14:32:00', status: 'SUCCESS', hash: '0x8f7c...29b1' },
                { id: 'tx_2', amount: 15.00, token: 'USDC', merchant: 'Apple Music Refund', timestamp: '2026-07-18 09:15:22', status: 'SUCCESS', hash: '0x321a...71fa' },
                { id: 'tx_3', amount: 3500.00, token: 'JPYSC', merchant: 'Housing Rent', timestamp: '2026-07-17 17:40:10', status: 'SUCCESS', hash: '0xef88...9bc3' }
            ],
            currentSession: null,
            systemPaused: false // Emergency Pause Switch
        };

        // Session constructor
        function generateSession() {
            const id = '0x' + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
            const now = Math.floor(Date.now() / 1000);
            const nonce = Math.floor(Math.random() * 900000) + 100000;
            const validBefore = now + 30; // 30 seconds validity window
            const shortToken = 'stkn_' + Math.floor(Math.random() * 10000);
            
            state.currentSession = {
                id,
                nonce,
                validAfter: now,
                validBefore,
                shortToken,
                maxAmount: state.maxAmount,
                token: state.selectedToken,
                used: false
            };
            
            updateSimPanelSession();
            logSimEvent(`生成付款 Session: ${id.slice(0, 10)}...${id.slice(-8)} (上限: ${state.maxAmount})`, 'info');
        }

        // HTML5-like Router Setup
        const routes = {
            '/': loadOnboarding,
            '/home': loadHome,
            '/onboarding': loadOnboarding,
            '/select-token': loadSelectToken,
            '/set-limit': loadSetLimit,
            '/confirm-auth': loadConfirmAuth,
            '/success-activation': loadSuccessActivation,
            '/pay-code': loadPayCode,
            '/pay-success': loadPaySuccess,
            '/settings': loadSettings,
            '/history': loadHistory
        };

        function navigate(path) {
            // Push search parameter to be compatible with static HTML
            const url = new URL(window.location.href);
            url.searchParams.set('route', path);
            window.history.pushState({}, '', url.toString());
            renderRoute(path);
        }

        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const route = params.get('route') || '/';
            renderRoute(route);
        });

        function renderRoute(path) {
            const bottomNav = document.getElementById('bottom-nav');
            const onboardingRoutes = ['/', '/onboarding', '/select-token', '/set-limit', '/confirm-auth', '/success-activation'];
            
            if (onboardingRoutes.includes(path) && !state.isActivated) {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
                // Highlight active bottoms
                document.querySelectorAll('.nav-item').forEach(btn => {
                    if (btn.getAttribute('data-route') === path) {
                        btn.classList.add('text-indigo-600');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('text-indigo-600');
                        btn.classList.add('text-slate-400');
                    }
                });
            }

            // Load screen template
            const loadFunc = routes[path] || loadHome;
            loadFunc();
            
            // Re-render Lucide icons
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // WELCOME CAROUSEL (C-01)
        let activeWelcomeStep = 1;
        function loadOnboarding() {
            if (state.isActivated) {
                navigate('/home');
                return;
            }
            activeWelcomeStep = 1;
            renderWelcomeCard();
        }

        function renderWelcomeCard() {
            const container = document.getElementById('router-view');
            
            const steps = [
                {
                    title: "一键亮码，扫码即付",
                    desc: "用户无需每次支付输入金额。直接展示付款码，由商户POS扫码触发，3秒内完成安全扣款。",
                    icon: "qr-code"
                },
                {
                    title: "防刷单次额度限制",
                    desc: "基于 规范。每一次展示的付款码均可自主设定金额上限（maxAmount），商户扣款金额绝不能超出此设定。",
                    icon: "shield-check"
                },
                {
                    title: "完全非托管，资金安全",
                    desc: "协议不托管您的任何资产。付款代币直接从您的非托管钱包底层，点对点划转至商户智能合约结算账户。",
                    icon: "wallet-2"
                }
            ];

            const step = steps[activeWelcomeStep - 1];

            container.innerHTML = `
                <div class="page-container flex flex-col items-center justify-between min-h-[70vh] py-3">
                    <!-- Progress Indicators -->
                    <div class="flex gap-2 justify-center w-full mt-2">
                        ${[1, 2, 3].map(i => `
                            <div class="h-1.5 rounded-full transition-all duration-300 ${i === activeWelcomeStep ? 'w-8 bg-indigo-600' : 'w-2.5 bg-slate-200'}"></div>
                        `).join('')}
                    </div>

                    <!-- Intro Slide Content -->
                    <div class="my-4 flex flex-col items-center">
                        <div class="w-20 h-20 bg-indigo-50 border border-indigo-100 rounded-3xl flex items-center justify-center text-indigo-600 shadow-md mb-5">
                            <i data-lucide="${step.icon}" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-xl font-bold font-display text-slate-800 text-center mb-3 px-4">${step.title}</h2>
                        <p class="text-xs text-slate-400 text-center leading-relaxed px-5">${step.desc}</p>
                    </div>

                    <!-- CTA Actions -->
                    <div class="w-full flex flex-col gap-3">
                        <button onclick="nextWelcomeStep()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-2xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-1.5 active:scale-[0.98]">
                            <span>${activeWelcomeStep === 3 ? '开始激活设置' : '继续下一步'}</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function nextWelcomeStep() {
            if (activeWelcomeStep < 3) {
                activeWelcomeStep++;
                renderWelcomeCard();
                if (window.lucide) window.lucide.createIcons();
            } else {
                navigate('/select-token');
            }
        }

        // C-02 SELECT TOKEN
        function loadSelectToken() {
            const container = document.getElementById('router-view');
            
            container.innerHTML = `
                <div class="page-container flex flex-col justify-between min-h-[70vh] py-2">
                    <div>
                        <div class="mb-5">
                            <span class="text-indigo-600 text-[10px] font-bold uppercase tracking-widest">Step 1 / 3</span>
                            <h2 class="text-xl font-bold font-display text-slate-800">选择支付代币</h2>
                            <p class="text-xs text-slate-400 mt-1">请选择您作为 CPM 协议的底层主要扣款稳定币：</p>
                        </div>

                        <div class="flex flex-col gap-2.5">
                            <!-- Token JPYSC -->
                            <div onclick="selectTokenOption('JPYSC')" class="p-4 rounded-2xl border-2 cursor-pointer transition flex items-center justify-between ${state.selectedToken === 'JPYSC' ? 'border-indigo-600 bg-indigo-50/20' : 'border-slate-200 hover:border-slate-300'}">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center text-orange-600 font-extrabold font-display">
                                        ¥
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-1.5">
                                            <span class="text-sm font-bold text-slate-800">JPYSC</span>
                                            <span class="px-1.5 py-0.5 rounded text-[8px] bg-orange-50 text-orange-600 font-semibold uppercase tracking-wider font-mono">稳定币</span>
                                        </div>
                                        <span class="text-[10px] text-slate-400">日元结算代币 (CPMP 官方)</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm font-bold text-slate-800 font-mono">¥${state.walletBalance.JPYSC.toLocaleString()}</div>
                                    <span class="text-[9px] text-slate-400">可用余额</span>
                                </div>
                            </div>

                            <!-- Token USDC -->
                            <div onclick="selectTokenOption('USDC')" class="p-4 rounded-2xl border-2 cursor-pointer transition flex items-center justify-between ${state.selectedToken === 'USDC' ? 'border-indigo-600 bg-indigo-50/20' : 'border-slate-200 hover:border-slate-300'}">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 font-extrabold font-display">
                                        $
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-1.5">
                                            <span class="text-sm font-bold text-slate-800">USDC</span>
                                            <span class="px-1.5 py-0.5 rounded text-[8px] bg-blue-50 text-blue-600 font-semibold uppercase tracking-wider font-mono">稳定币</span>
                                        </div>
                                        <span class="text-[10px] text-slate-400">USD Coin (Center)</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm font-bold text-slate-800 font-mono">$${state.walletBalance.USDC.toLocaleString()}</div>
                                    <span class="text-[9px] text-slate-400">可用余额</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-6">
                        <button onclick="navigate('/onboarding')" class="flex-1 bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold py-3 rounded-2xl transition text-center text-xs">
                            上一步
                        </button>
                        <button onclick="navigate('/set-limit')" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-1.5 text-xs">
                            <span>设定限额</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function selectTokenOption(tok) {
            state.selectedToken = tok;
            loadSelectToken();
            if (window.lucide) window.lucide.createIcons();
        }

        // C-03 SET LIMIT
        function loadSetLimit() {
            const container = document.getElementById('router-view');
            
            container.innerHTML = `
                <div class="page-container flex flex-col justify-between min-h-[70vh] py-2">
                    <div>
                        <div class="mb-5">
                            <span class="text-indigo-600 text-[10px] font-bold uppercase tracking-widest">Step 2 / 3</span>
                            <h2 class="text-xl font-bold font-display text-slate-800">单次最高消费额度</h2>
                            <p class="text-xs text-slate-400 mt-1">设置每一次亮起付款码，商户所能扫描扣款的最大数值限制。</p>
                        </div>

                        <!-- Limit Indicator Box -->
                        <div class="bg-slate-50 border border-slate-100 rounded-3xl p-5 text-center mb-4">
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Max Amount per code</span>
                            <div class="text-3xl font-bold text-indigo-600 font-display flex items-center justify-center gap-1">
                                <span>${state.selectedToken === 'JPYSC' ? '¥' : '$'}</span>
                                <span id="limit-val">${state.maxAmount.toLocaleString()}</span>
                            </div>
                            <span class="text-[10px] text-slate-400 mt-2 block leading-normal">安全机制：商户POS发起请求超过该金额将拒绝交易。</span>
                        </div>

                        <!-- Quick Limit Presets -->
                        <div class="grid grid-cols-4 gap-2 mb-5">
                            ${[1000, 3000, 5000, 10000].map(val => `
                                <button onclick="setLimitPreset(${val})" class="py-2.5 rounded-xl border font-bold text-xs transition ${state.maxAmount === val ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}">
                                    ${state.selectedToken === 'JPYSC' ? '¥' : '$'}${val.toLocaleString()}
                                </button>
                            `).join('')}
                        </div>

                        <!-- Numeric Pad Simulator -->
                        <div class="grid grid-cols-3 gap-1.5 max-w-xs mx-auto">
                            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `
                                <button onclick="appendLimitNum(${num})" class="py-3 rounded-xl hover:bg-slate-50 font-bold text-lg text-slate-700 transition active:scale-95">${num}</button>
                            `).join('')}
                            <button onclick="clearLimit()" class="py-3 text-xs font-bold text-slate-400 hover:text-slate-600 transition">清空</button>
                            <button onclick="appendLimitNum(0)" class="py-3 rounded-xl hover:bg-slate-50 font-bold text-lg text-slate-700 transition active:scale-95">0</button>
                            <button onclick="backspaceLimit()" class="py-3 flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
                                <i data-lucide="delete" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-6">
                        <button onclick="navigate('/select-token')" class="flex-1 bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold py-3 rounded-2xl transition text-center text-xs">
                            上一步
                        </button>
                        <button onclick="navigate('/confirm-auth')" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-1.5 text-xs">
                            <span>下一步: 签署授权</span>
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function setLimitPreset(val) {
            state.maxAmount = val;
            loadSetLimit();

            // Generate standard CPMP payment URI protocol string
            const payload = `CPMP://PAY/1/${state.currentSession.id}/${state.currentSession.shortToken}`;
            
            new QRious({
                element: canvas,
                value: payload,
                size: 180,
                background: '#f8fafc',
                foreground: '#1e1b4b',
                level: 'Q'
            });
        }

        function startCountdown() {
            const bar = document.getElementById('countdown-progress');
            const text = document.getElementById('countdown-text');
            const card = document.getElementById('qr-card');
            
            if (!bar) return;

            countdownTimer = setInterval(() => {
                countdownSec--;
                
                // Keep progress matching
                const percent = (countdownSec / 30) * 100;
                bar.style.width = `${percent}%`;
                text.innerHTML = `
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-indigo-500"></i>
                    <span>付款码有效倒计时: ${countdownSec}秒</span>
                `;
                if (window.lucide) window.lucide.createIcons();

                // Style updates as timer ticks close to expiry (CountdownBar specification)
                if (countdownSec <= 10) {
                    bar.classList.remove('bg-indigo-600');
                    bar.classList.add('bg-red-500');
                    text.classList.add('text-red-500', 'animate-pulse');
                    card.classList.add('border-red-200');
                }

                if (countdownSec <= 5) {
                    card.classList.add('animate-shake');
                }

                if (countdownSec <= 0) {
                    clearInterval(countdownTimer);
                    card.classList.remove('animate-shake');
                    // Automatic rotation/refresh (automatic refresh rules)
                    manualRefreshQR();
                }
            }, 1000);
        }

        function manualRefreshQR() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
            }
            const card = document.getElementById('qr-card');
            if (card) {
                card.classList.remove('animate-shake', 'border-red-200');
            }
            loadPayCode();

                                <span class="font-mono text-slate-700 bg-white px-2 py-0.5 rounded border border-slate-200/40">${lastCompletedTx.hash}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">活跃会话 (Session ID)</span>
                                <span class="font-mono font-bold text-slate-800 truncate max-w-[160px]">${lastCompletedTx.sessionId}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">代币转移路径</span>
                                <span class="font-mono text-slate-500">钱包 → Router</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">当前代币可用余额</span>
                                <span class="font-bold text-indigo-600 font-mono">${state.selectedToken === 'JPYSC' ? '¥' : '$'}${state.walletBalance[state.selectedToken].toLocaleString()}</span>
                            </div>
                        </div>
                    </div>

                    <div class="w-full flex flex-col gap-3 mt-6">
                        <button onclick="navigate('/pay-code')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-2xl transition shadow-lg shadow-indigo-100 flex items-center justify-center gap-1.5 text-xs active:scale-[0.98]">
                            <i data-lucide="qr-code" class="w-4 h-4"></i>
                            <span>再生成一个付款码</span>
                        </button>
                        <button onclick="navigate('/home')" class="w-full bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold py-2.5 rounded-2xl transition text-xs text-center">
                            返回电子钱包
                        </button>
                    </div>
                </div>
            `;
        }

        // C-30 TRANSACTION HISTORY
        function loadHistory() {
            const container = document.getElementById('router-view');
            
            container.innerHTML = `
                <div class="page-container py-1">
                    <div class="mb-4">
                        <h2 class="text-lg font-bold text-slate-800 font-display">消费交易历史</h2>
                        <p class="text-xs text-slate-400 mt-0.5">链上已确认 (PaymentExecuted) 智能合约流水：</p>
                    </div>

                    <div class="flex flex-col gap-3">
                        ${state.history.length === 0 ? `
                            <div class="text-center py-12 text-slate-400 text-xs">
                                <i data-lucide="inbox" class="w-10 h-10 mx-auto text-slate-300 mb-2"></i>
                                <span>没有查询到相关历史扣款流水</span>
                            </div>
                        ` : state.history.map(tx => `
                            <div class="p-3.5 bg-white border border-slate-100 rounded-2xl shadow-sm hover:bg-slate-50/30 transition flex flex-col gap-3">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-9 h-9 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-600">
                                            <i data-lucide="store" class="w-4 h-4"></i>
                                        </div>
                                        <div>
                                            <h4 class="text-xs font-bold text-slate-800">${tx.merchant}</h4>
                                            <span class="text-[9px] text-slate-400">${tx.timestamp}</span>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm font-bold text-slate-800 font-mono">-${tx.token === 'JPYSC' ? '¥' : '$'}${tx.amount.toLocaleString()}</div>
                                        <span class="px-1.5 py-0.5 rounded text-[8px] bg-green-50 text-green-600 font-semibold uppercase leading-none font-mono">SUCCESS</span>
                                    </div>
                                </div>
                                <div class="bg-slate-50/50 p-2.5 rounded-xl flex items-center justify-between text-[10px] font-mono text-slate-400 border border-slate-100/50">
                                    <span>Tx: ${tx.hash}</span>
                                    <span class="text-indigo-600 hover:underline cursor-pointer flex items-center gap-0.5" onclick="alert('测试区块网络: 智能合约事件 PaymentExecuted 验证无误')">
                                        查看 ↗
                                    </span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // C-20 SECURITY & AUTHORIZATION SETTINGS
        function loadSettings() {
            const container = document.getElementById('router-view');
            
            container.innerHTML = `
                <div class="page-container py-1 space-y-4">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 font-display">安全授权管理</h2>
                        <p class="text-xs text-slate-400 mt-0.5">控制非托管钱包授权给 CPM 路由器合约的各项高级参数</p>
                    </div>

                    <!-- Authorization Card status -->
                    <div class="bg-white border border-slate-100 rounded-3xl p-4.5 shadow-sm space-y-4">
                        <div class="flex items-center justify-between pb-3.5 border-b border-slate-100">
                            <span class="text-xs text-slate-500">ERC-20 链上额度状态</span>
                            <span class="text-xs font-mono font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded border border-green-100">
                                🟢 已授权 (Approved)
                            </span>
                        </div>
                        
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between">
                                <span class="text-slate-400">当前首选代币：</span>
                                <span class="font-bold text-slate-800">${state.selectedToken}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">最高可扣上限：</span>
                                <span class="font-bold text-indigo-600 font-mono">${state.selectedToken === 'JPYSC' ? '¥' : '$'}${state.maxAmount.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">路由智能合约：</span>
                                <span class="font-mono text-slate-500">0x3009...71ab</span>
                            </div>
                        </div>

                        <div class="pt-2">
                            <button onclick="navigate('/set-limit')" class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-indigo-700 text-xs font-bold py-2 px-4 rounded-xl transition active:scale-95 flex items-center justify-center gap-1">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                <span>调整单次付款上限 (maxAmount)</span>
                            </button>
                        </div>
                    </div>

                    <!-- Dangerous control box -->
                    <div class="bg-red-50/40 border border-red-100 rounded-3xl p-4.5 space-y-3">
                        <h3 class="text-xs font-bold text-red-700 uppercase tracking-widest flex items-center gap-1">
                            <i data-lucide="shield-alert" class="w-4 h-4"></i>
                            <span>危险区域 / Risk Zone</span>
                        </h3>
                        <p class="text-[10px] text-red-600 leading-normal">
                            撤销授权将对区块链智能合约发起 <code class="font-mono bg-red-100 px-1 py-0.5 rounded">approve(router, 0)</code> 交易。撤销后，您将无法展示付款码进行任何免密快捷扣款支付。
                        </p>
                        <button onclick="executeRevokeMock()" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-red-900/10 flex items-center justify-center gap-1.5 active:scale-[0.98]">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                            <span>一键撤销 ERC-20 链上授权</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function executeRevokeMock() {
            if (!confirm('确定要发起区块链交易撤销对 支付合约的批准吗？此操作不可撤销，再次使用必须重新开通。')) {
                return;
            }

            logSimEvent("向用户钱包发起 Revoke 撤销授权交易", "info");
            
            // Temporary block layer simulation
            const view = document.getElementById('router-view');
            view.innerHTML = `
                <div class="page-container flex flex-col items-center justify-center min-h-[50vh] text-center gap-4">
                    <div class="w-12 h-12 rounded-full border-4 border-red-100 border-t-red-600 animate-spin"></div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">正在链上撤销授权...</h4>
                        <p class="text-xs text-slate-400 mt-1">正在等待区块网络撤销 approve 广播 (0x0)...</p>
                    </div>
                </div>
            `;

            setTimeout(() => {
                state.isActivated = false;
                logSimEvent("链上 Approve 额度成功清零！授权已失效。", "success");
                navigate('/onboarding');
            }, 2000);
        }

        // SIMULATOR INTERACTIVE PANEL CONTROLLER
        function toggleSimPanel() {
            const panel = document.getElementById('sim-panel');
            panel.classList.toggle('translate-x-full');
        }

        function updateSimPanelSession() {
            const idDiv = document.getElementById('sim-session-id');
            const limitSpan = document.getElementById('sim-max-limit');
            const submitBtn = document.getElementById('sim-submit-btn');
            const input = document.getElementById('sim-amount-input');
            const badge = document.getElementById('sim-token-badge');

            if (!state.currentSession) {
                idDiv.innerText = "请先前往“展示付款码”页面";
                limitSpan.innerText = "限额: --";
                submitBtn.disabled = true;
                return;
            }

            idDiv.innerText = state.currentSession.id;
            idDiv.title = state.currentSession.id;
            limitSpan.innerText = `上限: ¥${state.currentSession.maxAmount}`;
            badge.innerText = state.currentSession.token;
            submitBtn.disabled = false;
            
            // Suggest default checkout amount matching limit or random typical grocery bill
            input.value = Math.min(state.currentSession.maxAmount, 1280);
        }

        function logSimEvent(msg, type = 'info') {
            const logDiv = document.getElementById('sim-event-log');
            if (!logDiv) return;

            const now = new Date().toTimeString().split(' ')[0];
            let color = 'text-slate-400';
            let prefix = '[LOG]';

            if (type === 'success') {
                color = 'text-green-400 font-bold';
                prefix = '[OK]';
            } else if (type === 'error') {
                color = 'text-red-400 font-bold';
                prefix = '[ERR]';
            } else if (type === 'info') {
                color = 'text-indigo-300';
                prefix = '[INF]';
            }

            const item = document.createElement('div');
            item.className = `${color} leading-relaxed`;
            item.innerHTML = `<span class="text-slate-600">${now}</span> ${prefix} ${msg}`;
            
            logDiv.appendChild(item);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function executeSimulatedPayment() {
            const input = document.getElementById('sim-amount-input');
            const amount = parseFloat(input.value);
            
            if (!state.currentSession) {
                logSimEvent("商户扫码失败：付款码未初始化或不存在。", "error");
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                logSimEvent("商户扫码失败：金额必须大于0", "error");
                alert("请输入有效的扣款金额！");
                return;
            }

            // check limit constraint (AMOUNT_EXCEEDS_SESSION)
            if (amount > state.currentSession.maxAmount) {
                logSimEvent(`智能合约 Revert：金额 ${amount} 超出会话限制 ${state.currentSession.maxAmount} (AMOUNT_EXCEEDS_SESSION)`, "error");
                alert(`扣款失败：金额（¥${amount}）超出了该付款码单次允许扣款上限（¥${state.currentSession.maxAmount}）！`);
                return;
            }

            // Check if consumer balances are sufficient
            const currentBalance = state.walletBalance[state.currentSession.token];
            if (amount > currentBalance) {
                logSimEvent(`智能合约 Revert: 扣款代币余额不足 (TOKEN_TRANSFER_FAILED)`, "error");
                alert(`扣款失败：该消费者的代币余额（¥${currentBalance}）不足以支付当前金额（¥${amount}）！`);
                return;
            }

            // Simulate execution
            logSimEvent(`商户 POS 扫描付款码成功...`, "info");
            logSimEvent(`提交支付路由器交易至 0x3009...71ab`, "info");
            
            const submitBtn = document.getElementById('sim-submit-btn');
            submitBtn.disabled = true;

            setTimeout(() => {
                // Execute state deduction
                state.walletBalance[state.currentSession.token] = currentBalance - amount;
                
                // Add to history
                const hash = '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
                const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);
                
                lastCompletedTx = {
                    id: 'tx_' + Date.now(),
                    amount: amount,
                    token: state.currentSession.token,
                    merchant: '全家/罗森智能售货机 (Fuji POS)',
                    timestamp: nowStr,
                    status: 'SUCCESS',
                    hash: hash.slice(0, 8) + '...' + hash.slice(-6),
                    sessionId: state.currentSession.id
                };

                state.history.unshift(lastCompletedTx);

                // Show consumed overlay on QR page
                const consumedOverlay = document.getElementById('qr-consumed-overlay');
                if (consumedOverlay) {
                    consumedOverlay.classList.remove('hidden');
                }

                logSimEvent(`智能合约执行事件 PaymentExecuted 捕获成功！`, "success");
                logSimEvent(`扣减付款代币: -¥${amount} ${state.currentSession.token}`, "success");
                logSimEvent(`交易 Hash: ${hash.slice(0, 16)}...`, "success");

                // Beep Audio Synthesis for premium experience
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 880; // pure crystal check-out beep
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } catch(e) {}

                setTimeout(() => {
                    navigate('/pay-success');
                    toggleSimPanel();
                    updateSimPanelSession();
                }, 1000);

            }, 1500);
        }

        // INIT & LOAD FROM SEARCH PARAMS
        const params = new URLSearchParams(window.location.search);
        const initialRoute = params.get('route');
        const startRoute = initialRoute && initialRoute !== '/pay-code'
            ? initialRoute
            : (state.isActivated ? '/home' : '/onboarding');
        
        // Render starting route
        renderRoute(startRoute);
    </script>
</body>
</html>
