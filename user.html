<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CPMP 钱包 · 付款码</title>
<meta name="theme-color" content="#14161f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="CPMP-3009 消费者钱包 —— 展码即付">
<link rel="manifest" href='data:application/manifest+json,{"name":"CPMP Wallet","short_name":"CPMP","display":"standalone","background_color":"%2314161f","theme_color":"%2314161f"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --ink-900:#14161f;
  --ink-800:#1c1f2c;
  --ink-700:#262b3d;
  --ink-600:#3a4058;
  --ink-mute:#8b90a3;
  --paper-50:#f7f9f7;
  --paper-100:#edf1ec;
  --paper-200:#e2e8e2;
  --line-on-paper:rgba(20,22,31,.09);
  --line-on-ink:rgba(255,255,255,.10);
  --gold:#d9a441;
  --gold-dark:#b5822b;
  --gold-soft:#f2e2bd;
  --hanko:#b3413a;
  --hanko-soft:#f4dcd9;
  --teal:#1f8a70;
  --teal-soft:#d9efe8;
  --amber-warn:#c98a1f;
  --radius-l:22px;
  --radius-m:14px;
  --radius-s:9px;
  --font-display:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans',sans-serif;
  --font-body:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --shell-w:440px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-body);
  background:
    radial-gradient(1100px 700px at 50% -10%, #232741 0%, var(--ink-900) 60%);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
a{color:inherit}
::selection{background:var(--gold-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img,svg{display:block}
svg{width:1em;height:1em;flex:none}

/* ---------- App shell / responsive frame ---------- */
#app-frame{
  position:relative;
  width:100%;
  max-width:var(--shell-w);
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  background:var(--paper-50);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media (min-width:560px){
  body{ padding:28px 0; display:flex; }
  #app-frame{
    min-height:calc(100vh - 56px);
    min-height:calc(100dvh - 56px);
    border-radius:32px;
    box-shadow:
      0 0 0 8px #0c0d13,
      0 30px 60px -20px rgba(0,0,0,.55),
      0 10px 30px rgba(0,0,0,.35);
  }
}
@media (min-width:900px){
  :root{ --shell-w:460px; }
}

#view{ flex:1 1 auto; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding-bottom:8px;}
.page{ animation:page-in .32s cubic-bezier(.2,.8,.2,1); flex:1 1 auto; min-height:100%; display:flex; flex-direction:column;}
@keyframes page-in{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; gap:8px;
  padding:calc(14px + var(--safe-t)) 14px 12px;
  background:var(--paper-50);
  position:sticky; top:0; z-index:5;
  border-bottom:1px solid transparent;
}
.topbar.is-scrolled{ border-bottom-color:var(--line-on-paper); }
.topbar .tb-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--ink-900);
  flex:none;
}
.topbar .tb-btn:active{ background:var(--paper-200); }
.topbar h1{
  font-family:var(--font-display); font-weight:700; font-size:17px; margin:0;
  flex:1; text-align:center; letter-spacing:.01em;
}
.topbar .tb-spacer{width:38px;flex:none}

/* ---------- Tab bar ---------- */
.tabbar{
  display:flex; background:var(--ink-900); flex:none;
  padding:6px 6px calc(6px + var(--safe-b));
  border-top:1px solid var(--line-on-ink);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none;border:none;padding:8px 4px 6px;color:var(--ink-mute);
  min-height:48px; justify-content:center; position:relative; border-radius:14px;
}
.tab svg{width:22px;height:22px}
.tab span{font-size:10.5px; font-weight:500; letter-spacing:.02em}
.tab.active{color:var(--gold-soft)}
.tab.active svg{color:var(--gold)}
.tab .tab-fab{
  position:absolute; top:-20px; width:52px;height:52px;border-radius:50%;
  background:linear-gradient(160deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px -4px rgba(217,164,65,.55), 0 0 0 6px var(--ink-900);
}
.tab .tab-fab svg{width:24px;height:24px;color:var(--ink-900)}
.tab.is-fab span{margin-top:26px;color:var(--gold-soft)}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px; border-radius:16px; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:700; font-size:15.5px;
  padding:0 20px; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{ transform:scale(.98); }
.btn-primary{ background:linear-gradient(160deg,var(--gold),var(--gold-dark)); color:var(--ink-900); box-shadow:0 10px 22px -8px rgba(217,164,65,.6);}
.btn-primary:disabled{ background:var(--paper-200); color:var(--ink-mute); box-shadow:none; cursor:not-allowed; }
.btn-ghost{ background:transparent; color:var(--ink-900); border:1.5px solid var(--line-on-paper); }
.btn-ghost.on-ink{ color:var(--paper-50); border-color:var(--line-on-ink); }
.btn-danger-text{ background:none;border:none;color:var(--hanko);font-weight:700;font-family:var(--font-display);font-size:14.5px;padding:14px 4px;cursor:pointer;}
.btn-block{width:100%}
.btn-sm{min-height:38px;font-size:13px;padding:0 14px;border-radius:12px}
.link-btn{ background:none;border:none;color:var(--ink-mute);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

/* ---------- Cards & sections ---------- */
.px{padding-left:18px;padding-right:18px}
.section{padding:14px 18px}
.card{ background:var(--paper-50); border:1px solid var(--line-on-paper); border-radius:var(--radius-l); padding:18px; }
.card-flat{ background:#fff; border-radius:var(--radius-m); border:1px solid var(--line-on-paper); }
.eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.14em; color:var(--ink-mute); text-transform:uppercase; }
.h-display{ font-family:var(--font-display); font-weight:900; letter-spacing:-.01em; }
.muted{color:var(--ink-mute)}
.divider{height:1px;background:var(--line-on-paper);margin:14px 0;border:none}

/* ---------- Ink dark hero sections (onboarding / success / approve) ---------- */
.ink-full{ background:var(--ink-900); color:var(--paper-50); flex:1 1 auto; display:flex; flex-direction:column; min-height:100%;}
.ink-full .muted-on-ink{ color:var(--ink-mute); }

/* ---------- Onboarding ---------- */
#onb-root{ position:relative; overflow:hidden; }
.onb-skip{ position:absolute; top:calc(16px + var(--safe-t)); right:16px; z-index:3; background:none;border:none;color:var(--ink-mute);font-size:13.5px;font-weight:500;padding:8px;cursor:pointer;}
.onb-track{ flex:1; display:flex; position:relative; width:100%; }
.onb-slide{ flex:0 0 100%; min-width:100%; width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; padding:64px 28px 20px; transition:none; box-sizing:border-box; }
.onb-art{ width:180px;height:180px; margin-bottom:8px; }
.onb-slide h2{ font-family:var(--font-display); font-size:24px; font-weight:900; margin:22px 0 12px; }
.onb-slide p{ color:var(--ink-mute); font-size:14.5px; line-height:1.7; max-width:300px; }
.onb-dots{ display:flex; justify-content:center; gap:7px; padding:6px 0 4px; }
.onb-dot{ width:7px;height:7px;border-radius:50%; background:var(--ink-600); transition:all .25s; cursor:pointer; }
.onb-dot.active{ width:22px; background:var(--gold); }
.onb-foot{ padding:18px 24px calc(28px + var(--safe-b)); }

/* ---------- Token select list ---------- */
.tok-item{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius-m);
  border:1.5px solid var(--line-on-paper); background:#fff; margin-bottom:10px; cursor:pointer;
  transition:border-color .15s, background .15s;
}
.tok-item.selected{ border-color:var(--gold); background:linear-gradient(0deg,#fff,#fff),linear-gradient(160deg,rgba(217,164,65,.12),rgba(217,164,65,0)); box-shadow:0 0 0 1px var(--gold) inset; }
.tok-item.disabled{ opacity:.5; cursor:default; }
.tok-badge{ width:44px;height:44px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:900; font-size:14px; color:#fff; flex:none;}
.tok-info{flex:1; min-width:0}
.tok-info .name{font-weight:700;font-size:15px}
.tok-info .bal{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-mute);margin-top:2px}
.tok-check{ width:22px;height:22px;border-radius:50%; border:2px solid var(--line-on-paper); flex:none; display:flex;align-items:center;justify-content:center;}
.tok-item.selected .tok-check{ background:var(--gold); border-color:var(--gold); color:var(--ink-900);}

/* ---------- Amount keypad-style set limit ---------- */
.amt-display{ text-align:center; padding:26px 10px 6px; }
.amt-display .cur{font-size:20px;vertical-align:top;margin-right:4px;color:var(--ink-mute);font-family:var(--font-display);font-weight:700;}
.amt-display .num{font-family:var(--font-mono); font-size:44px; font-weight:700; letter-spacing:.01em;}
.amt-chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:6px 0 20px;}
.chip{ border:1.5px solid var(--line-on-paper); background:#fff; border-radius:99px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
.chip.active{ background:var(--ink-900); color:var(--gold-soft); border-color:var(--ink-900);}
.info-note{ display:flex; gap:10px; background:var(--paper-100); border-radius:var(--radius-m); padding:14px; font-size:12.8px; line-height:1.65; color:var(--ink-700);}
.info-note svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--gold-dark)}

/* ---------- Approve bottom sheet ---------- */
.sheet-backdrop{ position:fixed; inset:0; background:rgba(10,11,16,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s;}
.sheet-backdrop.show{ opacity:1; pointer-events:auto; }
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--paper-50);
  border-radius:24px 24px 0 0; padding:10px 20px calc(22px + var(--safe-b));
  transform:translateY(100%); transition:transform .32s cubic-bezier(.2,.85,.25,1);
  max-width:var(--shell-w); margin:0 auto;
}
.sheet-backdrop.show .sheet{ transform:translateY(0); }
.sheet-grabber{ width:36px;height:4px;border-radius:99px;background:var(--line-on-paper);margin:6px auto 14px;}
.sheet h3{font-family:var(--font-display);font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 14px}
.sheet .amt-line{ background:var(--paper-100); border-radius:var(--radius-m); padding:16px; font-size:14.5px; line-height:1.75; margin-bottom:12px;}
.sheet .amt-line b{font-family:var(--font-mono)}
.sheet .warn-line{ display:flex; gap:8px; font-size:12.5px; color:var(--amber-warn); line-height:1.6; padding:2px 2px 14px;}
.sheet .warn-line svg{flex:none;width:16px;height:16px;margin-top:2px}
.sheet-actions{ display:flex; gap:10px; }
.sheet-actions .btn{flex:1}

/* ---------- Address chip / amount display shared components ---------- */
.addr-chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12.5px; background:var(--paper-100); padding:5px 10px; border-radius:8px; cursor:pointer; border:none; color:var(--ink-700);}
.addr-chip svg{width:13px;height:13px;color:var(--ink-mute)}
.addr-chip:active{background:var(--paper-200)}
.kv-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:13.5px;gap:10px}
.kv-row .k{color:var(--ink-mute)}
.kv-row .v{font-weight:600;text-align:right}

/* ---------- Signature element: perforated payment ticket / QR stub ---------- */
.ticket-wrap{ padding:6px 20px 4px; }
.ticket{
  position:relative; background:#fff; border-radius:20px; padding:26px 22px 20px;
  box-shadow:0 18px 40px -18px rgba(20,22,31,.35), 0 2px 0 rgba(20,22,31,.03);
}
.ticket::before,.ticket::after{
  content:""; position:absolute; width:26px;height:26px; background:var(--paper-50);
  border-radius:50%; top:50%; transform:translateY(-50%); box-shadow:0 0 0 1px var(--line-on-paper) inset;
}
.ticket::before{ left:-13px; }
.ticket::after{ right:-13px; }
.ticket .tear{ border-top:2px dashed var(--line-on-paper); margin:18px 0 14px; }
.qr-zone{ position:relative; display:flex; align-items:center; justify-content:center; }
.qr-zone canvas{ border-radius:12px; }
.qr-payload{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-mute); text-align:center; word-break:break-all; padding:10px 6px 2px; letter-spacing:.01em;}
.qr-used-mask{
  position:absolute; inset:0; background:rgba(247,249,247,.92); border-radius:12px;
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s;
}
.qr-used-mask.show{ opacity:1; }
.hanko-stamp{
  width:104px;height:104px;border-radius:50%; border:5px solid var(--hanko); color:var(--hanko);
  display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:900;
  font-size:26px; transform:rotate(-14deg) scale(0); letter-spacing:.05em;
}
.hanko-stamp.pop{ animation:stamp-in .45s cubic-bezier(.3,1.6,.4,1) forwards; }
@keyframes stamp-in{ 0%{transform:rotate(-14deg) scale(2.2); opacity:0;} 60%{opacity:1;} 100%{transform:rotate(-14deg) scale(1); opacity:1;} }

.pay-meta-row{ display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 4px 2px; font-size:13.5px; font-weight:600;}
.pay-meta-row .sep{color:var(--line-on-paper)}
.pay-meta-row .tok-dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pay-lock-note{ display:flex; align-items:center; justify-content:center; gap:6px; color:var(--ink-mute); font-size:12px; padding:6px 0 2px;}
.pay-lock-note svg{width:13px;height:13px}

/* countdown bar */
.countdown{ padding:16px 4px 4px; }
.countdown-top{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-mute); margin-bottom:6px; font-family:var(--font-mono);}
.countdown-track{ height:7px; border-radius:99px; background:var(--paper-200); overflow:hidden;}
.countdown-fill{ height:100%; border-radius:99px; background:var(--teal); transition:width 1s linear, background .3s; width:100%;}
.countdown-fill.warn{ background:var(--amber-warn); }
.countdown-fill.danger{ background:var(--hanko); animation:pulse-bar 1s infinite; }
@keyframes pulse-bar{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)} }

.pay-actions-row{ display:flex; gap:10px; padding:16px 20px 4px;}
.pay-actions-row .btn{flex:1}
.demo-trigger{
  margin:14px 20px 4px; border:1.5px dashed var(--ink-600); background:none; color:var(--ink-mute);
  border-radius:14px; padding:12px; font-size:12.5px; font-weight:600; width:calc(100% - 40px);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.demo-trigger svg{width:15px;height:15px}

/* ---------- Success screens ---------- */
.success-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 26px calc(24px + var(--safe-b)); }
.success-ring{
  width:88px;height:88px;border-radius:50%; background:radial-gradient(circle at 30% 25%, #2bb98f, var(--teal));
  display:flex;align-items:center;justify-content:center; margin-bottom:22px; box-shadow:0 16px 34px -10px rgba(31,138,112,.55);
  transform:scale(0); animation:ring-in .5s cubic-bezier(.3,1.5,.4,1) .05s forwards;
}
@keyframes ring-in{ to{transform:scale(1)} }
.success-ring svg{width:44px;height:44px;color:#fff}
.success-wrap h2{ font-family:var(--font-display); font-weight:900; font-size:21px; margin:0 0 4px;}
.success-amt{ font-family:var(--font-mono); font-weight:700; font-size:34px; margin:14px 0 6px;}
.success-card{ width:100%; background:var(--ink-800); border-radius:var(--radius-l); padding:18px 18px 6px; margin-top:20px; text-align:left;}
.success-card .kv-row{border-bottom:1px solid var(--line-on-ink)}
.success-card .kv-row:last-child{border-bottom:none}
.success-card .kv-row .k{color:var(--ink-mute)}
.success-actions{ display:flex; gap:10px; width:100%; margin-top:24px; }
.success-actions .btn{flex:1}
.confirm-steps{ display:flex; flex-direction:column; gap:14px; align-items:flex-start; text-align:left; width:100%; max-width:260px; margin-top:6px;}
.c-step{ display:flex; align-items:center; gap:12px; font-size:13.5px; color:var(--ink-mute); }
.c-step .dot{ width:22px;height:22px;border-radius:50%; border:2px solid var(--ink-600); flex:none; display:flex;align-items:center;justify-content:center;}
.c-step.done{ color:var(--paper-50); }
.c-step.done .dot{ background:var(--teal); border-color:var(--teal); }
.c-step.done .dot svg{width:13px;height:13px;color:#fff}
.c-step.active .dot{ border-color:var(--gold); }
.spin{ display:inline-flex; align-items:center; justify-content:center; animation:spin 0.9s linear infinite; }
@keyframes spin{ to{transform:rotate(360deg)} }

/* ---------- Home dashboard ---------- */
.hero-head{ padding:calc(20px + var(--safe-t)) 20px 8px; }
.hero-greet{ color:var(--ink-mute); font-size:13px; }
.hero-name{ font-family:var(--font-display); font-weight:800; font-size:19px; margin-top:2px;}
.balance-card{
  margin:14px 18px 6px; border-radius:var(--radius-l); padding:22px 20px;
  background:linear-gradient(155deg,var(--ink-800),var(--ink-900) 70%); color:var(--paper-50);
  position:relative; overflow:hidden;
}
.balance-card::after{
  content:""; position:absolute; right:-40px; top:-40px; width:160px;height:160px; border-radius:50%;
  background:radial-gradient(circle, rgba(217,164,65,.22), transparent 70%);
}
.balance-card .lbl{ font-size:12px; color:var(--ink-mute); display:flex; align-items:center; gap:6px;}
.balance-card .amt{ font-family:var(--font-mono); font-weight:700; font-size:32px; margin:8px 0 2px;}
.balance-card .amt .unit{font-size:15px;color:var(--gold-soft);margin-left:6px;font-family:var(--font-display)}
.balance-cta{ margin-top:16px; display:flex; gap:10px; }
.quick-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:16px 18px 6px;}
.quick-item{ background:#fff; border:1px solid var(--line-on-paper); border-radius:var(--radius-m); padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; font-weight:600; text-align:center;}
.quick-item .ic{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--paper-100);}
.quick-item .ic svg{width:19px;height:19px;color:var(--gold-dark)}
.section-head{ display:flex; align-items:center; justify-content:between; justify-content:space-between; padding:18px 18px 6px;}
.section-head h3{ font-family:var(--font-display); font-size:15px; font-weight:800; margin:0;}

/* ---------- History list ---------- */
.hist-row{ display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line-on-paper); cursor:pointer;}
.hist-row:last-child{border-bottom:none}
.hist-ic{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; flex:none;}
.hist-ic.ok{ background:var(--teal-soft); color:var(--teal);}
.hist-ic.fail{ background:var(--hanko-soft); color:var(--hanko);}
.hist-ic.pending{ background:var(--gold-soft); color:var(--gold-dark);}
.hist-ic svg{width:18px;height:18px}
.hist-mid{flex:1; min-width:0}
.hist-mid .m1{font-weight:700; font-size:14px}
.hist-mid .m2{font-size:12px;color:var(--ink-mute); margin-top:2px}
.hist-amt{font-family:var(--font-mono); font-weight:700; font-size:14.5px; text-align:right; flex:none;}
.hist-amt.fail{color:var(--hanko); text-decoration:line-through; opacity:.7}
.empty-state{ text-align:center; padding:60px 30px; color:var(--ink-mute);}
.empty-state svg{width:48px;height:48px;margin:0 auto 14px;opacity:.5}

/* ---------- Settings ---------- */
.settings-group{ margin:0 18px 18px; background:#fff; border-radius:var(--radius-m); border:1px solid var(--line-on-paper); padding:4px 16px;}
.settings-group .kv-row{border-bottom:1px solid var(--line-on-paper)}
.settings-group .kv-row:last-child{border-bottom:none}
.settings-label{font-size:11.5px; font-weight:700; letter-spacing:.1em; color:var(--ink-mute); text-transform:uppercase; margin:22px 18px 8px;}
.settings-label:first-of-type{margin-top:6px}
.toggle{ width:44px;height:26px;border-radius:99px; background:var(--paper-200); position:relative; border:none; flex:none; cursor:pointer; transition:background .2s;}
.toggle::after{ content:""; position:absolute; width:20px;height:20px;border-radius:50%; background:#fff; top:3px;left:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.toggle.on{ background:var(--teal); }
.toggle.on::after{ left:21px; }
.edit-btn{background:none;border:none;color:var(--gold-dark);font-weight:700;font-size:13px;cursor:pointer}

/* ---------- Modal confirm (revoke etc.) ---------- */
.modal-backdrop{ position:fixed; inset:0; background:rgba(10,11,16,.55); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .2s;}
.modal-backdrop.show{opacity:1; pointer-events:auto;}
.modal-card{ background:var(--paper-50); border-radius:var(--radius-l); padding:22px; max-width:340px; width:100%; transform:scale(.92); transition:transform .2s;}
.modal-backdrop.show .modal-card{transform:scale(1)}
.modal-card .m-icon{width:44px;height:44px;border-radius:50%;background:var(--hanko-soft);color:var(--hanko);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.modal-card .m-icon svg{width:22px;height:22px}
.modal-card h4{font-family:var(--font-display); font-size:16.5px; font-weight:800; margin:0 0 8px}
.modal-card p{font-size:13.5px; color:var(--ink-mute); line-height:1.65; margin:0 0 18px}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1}

/* ---------- Toast ---------- */
#toast-host{ position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding-bottom:calc(96px + var(--safe-b)); z-index:80; pointer-events:none;}
.toast{
  background:var(--ink-900); color:var(--paper-50); font-size:13px; font-weight:500;
  padding:11px 18px; border-radius:99px; box-shadow:0 10px 26px -8px rgba(0,0,0,.5);
  display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(8px); transition:all .25s;
  max-width:86%;
}
.toast.show{opacity:1; transform:none;}
.toast svg{width:15px;height:15px;color:var(--gold); flex:none}

/* ---------- Misc ---------- */
.stack{display:flex;flex-direction:column;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between}
.pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;}
.pill.green{background:var(--teal-soft); color:var(--teal)}
.pill.red{background:var(--hanko-soft); color:var(--hanko)}
.pill.gold{background:var(--gold-soft); color:var(--gold-dark)}
.scan-line{ position:absolute; left:8%; right:8%; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:scan-move 1.6s ease-in-out infinite; }
@keyframes scan-move{ 0%{top:10%} 50%{top:88%} 100%{top:10%} }
.privacy-mode-toggle{position:absolute; top:14px; right:14px; z-index:2;}
.icon-btn-circle{width:34px;height:34px;border-radius:50%;background:var(--paper-100);border:none;display:flex;align-items:center;justify-content:center}
.icon-btn-circle svg{width:16px;height:16px}

/* ---------- Utils ---------- */
function fmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function truncAddr(a){ return a.slice(0,6)+'...'+a.slice(-4); }
function randHex(len){ let s=''; const chars='0123456789abcdef'; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*16)]; return s; }
function pad2(n){ return n.toString().padStart(2,'0'); }
function nowStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function copyText(txt, label){
  const done = ()=> showToast((label||'内容')+' 已复制', 'copy');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(done);
  } else { done(); }
}
function showToast(msg, iconName){
  const host = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className='toast';
  t.innerHTML = icon(iconName||'check') + '<span></span>';
  t.querySelector('span').textContent = msg;
  host.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=> t.remove(), 260); }, 2200);
}

/* ============================================================
   Router (HTML5 History API — pushState/popstate, no hash)
   ============================================================ */
const TAB_ROUTES = ['home','pay','history'];
let cleanupFn = null;

function parseLocation(){
  const p = new URLSearchParams(location.search);
  return { route: p.get('route') || (state.onboarded ? 'home' : 'onboarding'), params: { id:p.get('id')||null, slide:p.get('slide')||null } };
}

function navigate(route, params={}, replace=false){
  const q = new URLSearchParams();
  q.set('route', route);
  if(params.id) q.set('id', params.id);
  const url = location.pathname + '?' + q.toString();
  const st = {route, params};
  try{
    if(replace) history.replaceState(st, '', url);
    else history.pushState(st, '', url);
  }catch(e){ /* pushState can be restricted in some sandboxed contexts; state still renders */ }
  render(route, params);
}
function goBack(){ history.back(); }
window.addEventListener('popstate', (e)=>{
  const s = e.state || parseLocation();
  render(s.route, s.params||{});
});

function render(route, params={}){
  if(cleanupFn){ try{cleanupFn();}catch(e){} cleanupFn=null; }
  const page = PAGES[route] || PAGES.home;
  const view = document.getElementById('view');
  view.innerHTML = page.render(params);
  if(page.mount) cleanupFn = page.mount(params) || null;
  renderTabbar(route);
  view.scrollTop = 0;
}

function renderTabbar(route){
  const bar = document.getElementById('tabbar');
  if(!TAB_ROUTES.includes(route)){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const tabs = [
    {r:'home', label:'首页', ic:'home'},
    {r:'pay', label:'付款', ic:'qr', fab:true},
    {r:'history', label:'记录', ic:'history'},
  ];
  bar.innerHTML = tabs.map(t=>{
    if(t.fab){
      return `<button class="tab is-fab ${route===t.r?'active':''}" data-action="navigate" data-route="${t.r}" aria-label="${t.label}">
        <span class="tab-fab">${icon(t.ic)}</span><span>${t.label}</span></button>`;
    }
    return `<button class="tab ${route===t.r?'active':''}" data-action="navigate" data-route="${t.r}" aria-label="${t.label}">
      ${icon(t.ic)}<span>${t.label}</span></button>`;
  }).join('');
}

function topbar(title, opts={}){
  const back = opts.back ? `<button class="tb-btn" data-action="${opts.back}" aria-label="返回">${icon('back')}</button>` : `<span class="tb-spacer"></span>`;
  const right = opts.right || `<span class="tb-spacer"></span>`;
  return `<header class="topbar"><span class="tb-btn-wrap">${back}</span><h1>${title}</h1>${right}</header>`;
}

function qrDots(x,y,size){
  let out=''; const cell=size/8;

      <div class="onb-track" id="onb-track">

          <div class="onb-slide">
            ${onbArtSVG(s.art)}
            <h2>${s.title}</h2>
            <p>${s.body}</p>
          </div>`).join('')}
      </div>
      <div class="onb-dots">
        ${onboardingSlides.map((_,i)=>`<span class="onb-dot ${i===0?'active':''}" data-action="onb-dot" data-i="${i}"></span>`).join('')}
      </div>
      <div class="onb-foot">
        <button class="btn btn-primary btn-block" data-action="onb-next">下一步</button>
      </div>
    </div>`;
  },
  mount(){
    const root = document.getElementById('onb-root');
    const track = document.getElementById('onb-track');
    let idx = 0;
    let startX=null;
    function go(i){
      idx = Math.max(0, Math.min(onboardingSlides.length-1, i));
      track.style.transition='transform .32s cubic-bezier(.2,.8,.2,1)';
      track.style.transform = `translateX(-${idx*100}%)`;
      root.querySelectorAll('.onb-dot').forEach((d,j)=> d.classList.toggle('active', j===idx));
      const nextBtn = root.querySelector('[data-action="onb-next"]');
      nextBtn.textContent = idx===onboardingSlides.length-1 ? '开始设置' : '下一步';
      root.dataset.idx = idx;
    }
    function onTouchStart(e){ startX = e.touches[0].clientX; }
    function onTouchEnd(e){
      if(startX===null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40){ go(dx<0 ? idx+1 : idx-1); }
      startX=null;
    }
    track.addEventListener('touchstart', onTouchStart, {passive:true});
    track.addEventListener('touchend', onTouchEnd, {passive:true});
    root._go = go;
    root._getIdx = ()=>idx;
    return ()=>{ track.removeEventListener('touchstart', onTouchStart); track.removeEventListener('touchend', onTouchEnd); };
  }
};

const SESSION_TTL = 30; // seconds
function genSession(){
  return {
    id: 'sess_'+randHex(10),
    shortToken: randHex(16),
    validAfter: Date.now(),
    validBefore: Date.now() + SESSION_TTL*1000,
    consumed:false,
  };
}
function sessionPayload(s){ return `CPMP://PAY/1/${s.id}/${s.shortToken}`; }

PAGES.pay = {
  render(){
    const tok = tokenObj(state.selectedToken);
    if(!state.session || state.session.consumed) state.session = genSession();
    return `<div class="page">
      ${topbar('付款码')}
      <div class="ticket-wrap">
        <div class="ticket" id="ticket">
          <div class="qr-zone" id="qr-zone">
            <canvas id="qr-canvas" width="220" height="220"></canvas>
            <div class="qr-used-mask" id="qr-mask"><div class="hanko-stamp" id="hanko">已使用</div></div>
          </div>
          <div class="qr-payload" id="qr-payload"></div>
          <div class="tear"></div>
          <div class="countdown">
            <div class="countdown-top"><span>有效期</span><span id="cd-seconds">30秒</span></div>
            <div class="countdown-track"><div class="countdown-fill" id="cd-fill"></div></div>
          </div>
        </div>
      </div>
      <div class="pay-meta-row">
        <span class="tok-dot"></span><span>${tok.symbol}</span><span class="sep">|</span><span>单次上限 ¥${fmt(state.maxAmount)}</span>
      </div>
      <div class="pay-lock-note">${icon('lock')}此付款码仅限单次使用</div>
      <div class="pay-actions-row">
        <button class="btn btn-ghost" data-action="open-refresh-qr">${icon('refresh')} 刷新</button>
        <button class="btn btn-ghost" data-action="navigate" data-route="settings" data-sr="1">调整上限</button>
        <button class="btn btn-ghost" data-action="navigate" data-route="history">查看记录</button>
      </div>
      <button class="demo-trigger" data-action="simulate-scan">${icon('scan')} 模拟商户扫码收款（演示）</button>
    </div>`;
  },
  mount(){
    let timer=null, refreshedForSession=false, scanning=false;
    function drawFallbackQR(canvas, payload){
      // Deterministic pseudo-QR pattern drawn with Canvas 2D, used if the CDN
      // QR library can't load (e.g. no network) — keeps the demo visual intact.
      const ctx = canvas.getContext('2d');
      const size = 220, cells = 25, cell = size/cells;
      canvas.width = size; canvas.height = size;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
      ctx.fillStyle = '#14161f';
      let seed = 0; for(let i=0;i<payload.length;i++) seed = (seed*31 + payload.charCodeAt(i)) >>> 0;
      function rnd(){ seed = (seed*1103515245 + 12345) >>> 0; return (seed >>> 16) % 100; }
      function finder(cx,cy){
        ctx.fillStyle = '#14161f'; ctx.fillRect(cx*cell, cy*cell, cell*7, cell*7);
        ctx.fillStyle = '#ffffff'; ctx.fillRect((cx+1)*cell, (cy+1)*cell, cell*5, cell*5);
        ctx.fillStyle = '#14161f'; ctx.fillRect((cx+2)*cell, (cy+2)*cell, cell*3, cell*3);
      }
      for(let x=0;x<cells;x++){
        for(let y=0;y<cells;y++){
          const inFinder = (x<7&&y<7)||(x<7&&y>cells-8)||(x>cells-8&&y<7);
          if(inFinder) continue;
          if(rnd() < 46){ ctx.fillStyle = '#14161f'; ctx.fillRect(x*cell, y*cell, cell*0.92, cell*0.92); }
        }
      }
      finder(0,0); finder(cells-7,0); finder(0,cells-7);
    }
    function drawQR(){
      const canvas = document.getElementById('qr-canvas');
      const payload = sessionPayload(state.session);
      document.getElementById('qr-payload').textContent = payload;
      if(canvas){
        if(window.QRCode){
          QRCode.toCanvas(canvas, payload, {width:220, margin:1, color:{dark:'#14161f', light:'#ffffff'}}, function(err){
            if(err) drawFallbackQR(canvas, payload);
          });
        } else {
          drawFallbackQR(canvas, payload);
        }
      }
      document.getElementById('qr-mask').classList.remove('show');
      const hanko = document.getElementById('hanko'); if(hanko) hanko.classList.remove('pop');
    }
    function tick(){
      if(!state.session) return;
      const remain = Math.max(0, state.session.validBefore - Date.now());
      const secs = Math.ceil(remain/1000);
      const pct = Math.max(0, Math.min(100, (remain/(SESSION_TTL*1000))*100));
      const fill = document.getElementById('cd-fill');
      const label = document.getElementById('cd-seconds');
      if(!fill || !label) return;
      label.textContent = secs + '秒';
      fill.style.width = pct + '%';
      fill.classList.remove('warn','danger');
      if(secs<=5) fill.classList.add('danger');
      else if(secs<=10) fill.classList.add('warn');
      if(remain<=3000 && !refreshedForSession && !scanning){
        refreshedForSession = true;
        if(state.autoRefresh){ doRefresh(true); }
      }
    }
    function doRefresh(silent){
      state.session = genSession();
      refreshedForSession = false;
      drawQR();
      if(!silent) showToast('已生成新的付款码', 'refresh');
    }
    function onSimulateScan(){
      if(scanning) return;
      scanning = true;
      const mask = document.getElementById('qr-mask');
      const hanko = document.getElementById('hanko');
      mask.classList.add('show');
      requestAnimationFrame(()=> hanko.classList.add('pop'));
      const amount = Math.max(50, Math.round((Math.random()*0.85+0.1)*state.maxAmount/10)*10);
      const merchants = ['Family Mart 浦安店','Cafe Rin 咖啡','7-Eleven 舞浜店','Lawson 東雲店','Muji 有楽町'];
      const merchant = merchants[Math.floor(Math.random()*merchants.length)];
      const result = { amount, merchant, time:nowStr(), txHash:'0x'+randHex(24) };
      state.lastResult = result;
      state.session.consumed = true;
      state.history.unshift({ id:'pm_'+randHex(4), amount, merchant, time:result.time.slice(0,16), status:'ok', sessionId:state.session.id, tx:result.txHash });
      setTimeout(()=>{ navigate('pay-success', {}); }, 900);
    }
    document.getElementById('view').addEventListener('__noop', ()=>{});
    drawQR();
    tick();
    timer = setInterval(tick, 500);
    // expose handlers for delegation
    PAGES.pay._refresh = ()=> doRefresh(false);
    PAGES.pay._simulate = onSimulateScan;
    showToast('屏幕亮度已提升，便于商户扫码', 'sun');
    return ()=>{ if(timer) clearInterval(timer); };
  }
};

        <div class="kv-row"><span class="k">sessionId</span><span class="v"><button class="addr-chip" data-action="copy-generic" data-copy="${h.sessionId}" data-label="sessionId">${icon('copy')} ${h.sessionId.slice(0,12)}…</button></span></div>
        <div class="kv-row"><span class="k">时间</span><span class="v" style="font-family:var(--font-mono);font-size:12.5px">${h.time}</span></div>
        ${h.status==='fail' ? `<div class="kv-row"><span class="k">失败原因</span><span class="v" style="color:var(--hanko)">${h.reason}</span></div>` : ''}
      </div>
      <div class="settings-label">链上信息</div>
      <div class="settings-group">
        <div class="kv-row"><span class="k">交易 Hash</span><span class="v">${h.tx ? `<button class="addr-chip" data-action="view-tx" data-tx="${h.tx}">${icon('external')} ${truncAddr(h.tx)}</button>` : '—'}</span></div>
        <div class="kv-row"><span class="k">Token 合约</span><span class="v"><button class="addr-chip" data-action="copy-contract">${icon('copy')} ${truncAddr(CONTRACT_ADDR)}</button></span></div>
        <div class="kv-row"><span class="k">结算地址</span><span class="v"><button class="addr-chip" data-action="copy-generic" data-copy="0x${randHex(8)}Settle${randHex(6)}" data-label="结算地址">${icon('copy')} 0x${randHex(4)}…Settle</button></span></div>
      </div>
    </div>`;
  }
};

/* ============================================================
   PAGE: C-20 Settings
   ============================================================ */
PAGES.settings = {
  render(){
    const tok = tokenObj(state.selectedToken);
    const allowance = Math.max(state.maxAmount*20, 100000);
    return `<div class="page">
      ${topbar('支付设置', {back:'goto-home'})}
      <div class="settings-label">授权概览</div>
      <div class="settings-group">
        <div class="kv-row"><span class="k">当前授权 Token</span><span class="v">${tok.symbol} · ${tok.name}</span></div>
        <div class="kv-row"><span class="k">授权合约</span><span class="v"><button class="addr-chip" data-action="copy-contract">${icon('copy')} ${truncAddr(CONTRACT_ADDR)}</button></span></div>
        <div class="kv-row"><span class="k">当前 ERC-20 授权额度</span><span class="v" style="font-family:var(--font-mono)">${fmt(allowance)} ${tok.symbol}</span></div>
      </div>
      <div class="settings-label">付款码设置</div>
      <div class="settings-group">
        <div class="kv-row"><span class="k">单次上限（maxAmount）</span><span class="v" style="display:flex;align-items:center;gap:10px"><span style="font-family:var(--font-mono)">¥${fmt(state.maxAmount)}</span><button class="edit-btn" data-action="open-edit-limit">修改</button></span></div>
        <div class="kv-row"><span class="k">自动刷新</span><span class="v"><button class="toggle ${state.autoRefresh?'on':''}" data-action="toggle-autorefresh" aria-label="自动刷新开关"></button></span></div>
        <div class="kv-row"><span class="k">靠近付款模式</span><span class="v"><button class="toggle ${state.privacyMode?'on':''}" data-action="toggle-privacy" aria-label="靠近付款模式开关"></button></span></div>
      </div>
      <div class="settings-label">高级</div>
      <div class="settings-group">
        <div class="kv-row" style="cursor:pointer" data-action="view-contract"><span class="k">查看合约详情</span><span class="v">${icon('external')}</span></div>
      </div>
      <div class="px" style="padding-top:4px">
        <button class="btn-danger-text" data-action="open-revoke-confirm">撤销 ERC-20 授权</button>
      </div>
      <div style="height:8px"></div>
    </div>`;
  }
};

function editLimitSheetHTML(){
  return `<div class="sheet-grabber"></div>
    <h3>${icon('gear_edit')} 修改单次上限</h3>
    <div class="amt-display" style="padding:6px 10px 0">
      <span class="cur">¥</span><span class="num" id="edit-amt-num" style="font-size:36px">${fmt(state.maxAmount)}</span>
    </div>
    <div class="amt-chips">
      ${quickAmounts.map(a=>`<button class="chip ${state.maxAmount===a?'active':''}" data-action="edit-quick-amount" data-amt="${a}">¥${fmt(a)}</button>`).join('')}
    </div>
    <input type="range" min="500" max="${Math.max(20000, tokenObj(state.selectedToken).balance)}" step="100" value="${state.maxAmount}" id="edit-amt-slider" style="width:100%;accent-color:var(--gold);margin-bottom:16px">
    <div class="sheet-actions">
      <button class="btn btn-ghost" data-action="close-sheet">取消</button>
      <button class="btn btn-primary" data-action="save-limit">保存</button>
    </div>`;
}

function revokeModalHTML(stage){
  if(stage==='confirm'){
    return `<div class="m-icon">${icon('alert')}</div>
      <h4>撤销 ERC-20 授权？</h4>
      <p>撤销后将无法使用付款码支付，需要重新完成开通流程才能继续使用。此操作会提交 <b>approve(router, 0)</b> 交易。</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="close-modal">取消</button>
        <button class="btn btn-primary" style="background:var(--hanko);color:#fff" data-action="confirm-revoke">确认撤销</button>
      </div>`;
  }
  return `<div style="text-align:center;padding:10px 0">
    <div style="width:30px;height:30px;margin:0 auto" class="spin">${icon('refresh')}</div>
    <p style="margin-top:14px;font-weight:700;font-size:14px">正在提交撤销交易…</p>
  </div>`;
}

/* ============================================================
   Global action dispatcher (event delegation)
   ============================================================ */
function goHomeOrOnboarding(){ navigate(state.onboarded ? 'home' : 'onboarding', {}, true); }

const ACTIONS = {
  'navigate'(el){
    const route = el.dataset.route;
    if(route==='settings' && el.dataset.sr){ /* from pay page "调整上限" */ }
    if((route==='pay') && !state.approved){ showToast('请先完成付款码开通设置', 'shield'); navigate('onboarding'); return; }
    navigate(route);
  },
  'onb-skip'(){ state.onboarded=true; navigate('home', {}, true); },
  'onb-dot'(el){ const root=document.getElementById('onb-root'); root._go(parseInt(el.dataset.i,10)); },
  'onb-next'(){
    const root=document.getElementById('onb-root');
    const idx = root._getIdx();
    if(idx < onboardingSlides.length-1){ root._go(idx+1); }
    else { navigate('select-token'); }
  },
  'select-token'(el){
    const sym = el.dataset.sym;
    if(tokenObj(sym).balance<=0){ showToast(sym+' 余额不足，仍可选择，后续请先充值', 'alert'); }
    state.selectedToken = sym;
    render('select-token');
  },
  'goto-set-limit'(){ navigate('set-limit'); },
  'goto-select-token'(){ navigate('select-token'); },
  'quick-amount'(el){
    state.maxAmount = parseInt(el.dataset.amt,10);
    render('set-limit');
  },
  'open-approve'(){ openSheet(approveSheetHTML('confirm')); },
  'close-sheet'(){ closeSheet(); },
  'confirm-approve'(){
    openSheet(approveSheetHTML('signing'));
    setTimeout(()=>{
      openSheet(approveSheetHTML('pending'));
      setTimeout(()=>{
        closeSheet();
        state.approved = true;
        state.onboarded = true;
        navigate('activated', {}, true);
      }, 1100);
    }, 1000);
  },
  'copy-contract'(){ copyText(CONTRACT_ADDR, '合约地址'); },
  'copy-tx'(el){ copyText(el.dataset.tx, '交易 ID'); },
  'copy-generic'(el){ copyText(el.dataset.copy, el.dataset.label); },
  'view-contract'(){ showToast('演示环境：未连接真实区块浏览器', 'external'); },
  'view-tx'(el){ showToast('演示环境：未连接真实区块浏览器', 'external'); },
  'open-refresh-qr'(){ if(PAGES.pay._refresh) PAGES.pay._refresh(); },
  'simulate-scan'(){ if(PAGES.pay._simulate) PAGES.pay._simulate(); },
  'new-qr-code'(){ state.session = genSession(); navigate('pay', {}, true); },
  'goto-history'(){ navigate('history', {}, true); },
  'goto-home'(){ navigate('home', {}, true); },
  'open-history-detail'(el){ navigate('history-detail', {id:el.dataset.id}); },
  'open-edit-limit'(){ openSheet(editLimitSheetHTML()); },
  'edit-quick-amount'(el){
    state.maxAmount = parseInt(el.dataset.amt,10);
    document.getElementById('edit-amt-num').textContent = fmt(state.maxAmount);
    document.querySelectorAll('#sheet-body .amt-chips .chip').forEach(c=> c.classList.toggle('active', parseInt(c.dataset.amt,10)===state.maxAmount));
    const slider = document.getElementById('edit-amt-slider'); if(slider) slider.value = state.maxAmount;
  },
  'save-limit'(){ closeSheet(); showToast('单次上限已更新为 ¥'+fmt(state.maxAmount), 'check'); render('settings'); },
  'toggle-autorefresh'(){ state.autoRefresh = !state.autoRefresh; render('settings'); },
  'toggle-privacy'(){ state.privacyMode = !state.privacyMode; render('settings'); showToast(state.privacyMode? '靠近付款模式已开启':'靠近付款模式已关闭', 'shield'); },
  'open-revoke-confirm'(){ openModal(revokeModalHTML('confirm')); },
  'close-modal'(){ closeModal(); },
  'confirm-revoke'(){
    openModal(revokeModalHTML('pending'));
    setTimeout(()=>{
      closeModal();
      state.approved = false;
      showToast('已模拟撤销授权，需重新开通', 'alert');
      navigate('onboarding', {}, true);
    }, 1100);
  },
};

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.action];
  if(fn) fn(el);
});

document.addEventListener('input', function(e){
  if(e.target.id==='edit-amt-slider'){
    state.maxAmount = parseInt(e.target.value,10);
    const n = document.getElementById('edit-amt-num'); if(n) n.textContent = fmt(state.maxAmount);
    document.querySelectorAll('#sheet-body .amt-chips .chip').forEach(c=> c.classList.toggle('active', parseInt(c.dataset.amt,10)===state.maxAmount));
  }
});

/* ---------- Init ---------- */
(function init(){
  const initial = parseLocation();
  if(!state.onboarded && initial.route!=='onboarding'){
    // fresh load without onboarding done: force onboarding
    render('onboarding');
    history.replaceState({route:'onboarding',params:{}}, '', location.pathname+'?route=onboarding');
  } else {
    render(initial.route, initial.params);
  }
})();
</script>
</body>
